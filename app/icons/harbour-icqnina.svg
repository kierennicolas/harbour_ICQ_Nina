<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Sailfish OS app icon silhouette: two sharp corners (top right,
         bottom left) and two quarter-circle sweeps of half the icon size. -->
    <clipPath id="shape">
      <path d="M254 2 V128 A126 126 0 0 1 128 254 H2 V128 A126 126 0 0 1 128 2 Z"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd98a"/>
      <stop offset="0.5" stop-color="#17a877"/>
      <stop offset="1" stop-color="#0a6e5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <rect width="256" height="256" fill="url(#glow)"/>
  </g>
  <g filter="url(#shadow)">
    <!-- speech bubble -->
    <path d="M86 66 H172 A30 30 0 0 1 202 96 V146 A30 30 0 0 1 172 176 H122 L86 204 L92 176 H86 A30 30 0 0 1 56 146 V96 A30 30 0 0 1 86 66 Z"
          fill="#ffffff"/>
    <!-- the number sign: on ICQ everyone is a number -->
    <g stroke="#13916f" stroke-width="12" stroke-linecap="round">
      <line x1="120" y1="88" x2="111" y2="156"/>
      <line x1="153" y1="88" x2="144" y2="156"/>
      <line x1="96" y1="109" x2="172" y2="109"/>
      <line x1="92" y1="135" x2="168" y2="135"/>
    </g>
    <!-- online dot -->
    <circle cx="198" cy="72" r="22" fill="#ff9b26" stroke="#ffffff" stroke-width="8"/>
  </g>
</svg>

name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OOS_VERSION: 0.24.0
  SFOS_RELEASE: 4.5.0.16

jobs:
  desktop:
    name: Library + integration tests (desktop Qt 5, local Open OSCAR Server)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt 5
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qtbase5-dev qt5-qmake qtdeclarative5-dev libqt5sql5-sqlite
      - name: Build liboscar, oscarprobe and the core tests
        run: |
          mkdir -p build && cd build
          qmake ../harbour_icq_nina.pro && make -j"$(nproc)"
      - name: Compile the Sailfish-only app sources (stub sailfishapp.h)
        run: tests/compile-app-sources.sh
      - name: Lint QML
        run: |
          sudo apt-get install -y -q qtdeclarative5-dev-tools
          find app/qml -name '*.qml' -print0 | xargs -0 -n1 /usr/lib/qt5/bin/qmllint
      - name: Fetch Open OSCAR Server ${{ env.OOS_VERSION }}
        run: |
          curl -sSL -o oos.tgz "https://github.com/mk6i/open-oscar-server/releases/download/v$OOS_VERSION/open_oscar_server.$OOS_VERSION.linux.x86_64.tar.gz"
          tar xzf oos.tgz
      - name: Integration tests
        run: |
          set -o pipefail
          rc=0
          tests/oos-integration.sh build/tools/oscarprobe/oscarprobe \
            "open_oscar_server.$OOS_VERSION.linux.x86_64/open_oscar_server" \
            build/tests/core/tst_core 2>&1 | tee integration.log || rc=$?
          grep -E '^(PASS|FAIL|== |integration:|Totals)|^   (Loc|Actual|Expected)|^FAIL!' integration.log > integration-summary.log || true
          ci/annotate.sh "$([ $rc = 0 ] && echo notice || echo error)" "Integration summary" integration-summary.log 160
          ci/annotate.sh "$([ $rc = 0 ] && echo notice || echo error)" "Integration tests" integration.log 80
          exit $rc

  sailfish:
    name: Sailfish OS armv7hl build (Qt 5.6) + ARM run under qemu
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space for the SDK image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Pull Sailfish SDK
        run: docker pull "coderus/sailfishos-platform-sdk-armv7hl:$SFOS_RELEASE"
      - name: Start a local Open OSCAR Server with two ICQ accounts
        run: |
          curl -sSL -o oos.tgz "https://github.com/mk6i/open-oscar-server/releases/download/v$OOS_VERSION/open_oscar_server.$OOS_VERSION.linux.x86_64.tar.gz"
          tar xzf oos.tgz
          cd "open_oscar_server.$OOS_VERSION.linux.x86_64"
          cat > ci.env <<CFG
          export OSCAR_LISTENERS=LOCAL://127.0.0.1:5190
          export OSCAR_ADVERTISED_LISTENERS_PLAIN=LOCAL://127.0.0.1:5190
          export TOC_LISTENERS=127.0.0.1:9898
          export API_LISTENER=127.0.0.1:8080
          export DB_PATH=$PWD/oscar.sqlite
          export DISABLE_AUTH=false
          export ICQ_LEGACY_ENABLED=false
          CFG
          (set -a; . ./ci.env; set +a; nohup ./open_oscar_server > server.log 2>&1 &)
          for _ in $(seq 1 50); do curl -s -o /dev/null http://127.0.0.1:8080/user && break; sleep 0.2; done
          for u in 100001 100002; do
            curl -sS -X POST http://127.0.0.1:8080/user -d "{\"screen_name\":\"$u\",\"password\":\"pw$u\"}"; echo
          done
      - name: Build with the Sailfish SDK and run the ARM binaries
        run: |
          set -o pipefail
          rc=0
          docker run --rm --privileged --network host \
            -e SFOS_RELEASE -e SFOS_ARCH=armv7hl \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "coderus/sailfishos-platform-sdk-armv7hl:$SFOS_RELEASE" /bin/bash /workspace/ci/sfos-build.sh 2>&1 | tee sfos.log || rc=$?
          ci/annotate.sh "$([ $rc = 0 ] && echo notice || echo error)" "Sailfish build" sfos.log 80
          exit $rc

  rpm:
    name: App RPM (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7hl   # Xperia XA2 and other 32-bit devices
            image: coderus/sailfishos-platform-sdk-armv7hl
          - arch: aarch64   # 64-bit images (Xperia 10 II and newer)
            image: coderus/sailfishos-platform-sdk
    env:
      SDK_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space for the SDK image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Pull Sailfish SDK
        run: docker pull "$SDK_IMAGE:$SFOS_RELEASE"
      - name: Build RPM
        id: build
        run: |
          set -o pipefail
          mkdir -p RPMS && chmod a+rwx RPMS
          if ! docker run --rm --privileged -e SFOS_RELEASE -e SFOS_ARCH=${{ matrix.arch }} \
              -v "$GITHUB_WORKSPACE:/workspace" "$SDK_IMAGE:$SFOS_RELEASE" \
              /bin/bash /workspace/ci/sfos-rpm.sh 2>&1 | tee rpm.log; then
            ci/annotate.sh error "RPM build log" rpm.log 160
            exit 1
          fi
          ls -l RPMS
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: harbour-icqnina-${{ matrix.arch }}
          path: RPMS/harbour-icqnina-[0-9]*.${{ matrix.arch }}.rpm
          if-no-files-found: error
      - name: Harbour RPM validator
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          rc=0
          docker run --rm --privileged -e SFOS_RELEASE -e SFOS_ARCH=${{ matrix.arch }} \
            -v "$GITHUB_WORKSPACE:/workspace" "$SDK_IMAGE:$SFOS_RELEASE" \
            /bin/bash /workspace/ci/sfos-validate.sh 2>&1 | tee validate.log || rc=$?
          ci/annotate.sh "$([ $rc = 0 ] && echo notice || echo error)" "Harbour validator ${{ matrix.arch }}" validate.log 200
          exit $rc
      - name: Install on Sailfish OS and load every page with real Silica
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.arch == 'armv7hl' }}
        run: |
          set -o pipefail
          rc=0
          docker run --rm --privileged -e SFOS_RELEASE -e SFOS_ARCH=${{ matrix.arch }} \
            -v "$GITHUB_WORKSPACE:/workspace" "$SDK_IMAGE:$SFOS_RELEASE" \
            /bin/bash /workspace/ci/sfos-qml-check.sh 2>&1 | tee qml.log || rc=$?
          ci/annotate.sh "$([ $rc = 0 ] && echo notice || echo error)" "QML check" qml.log 200
          exit $rc

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          **Sony Xperia XA2 (and other 32-bit devices): download the \`armv7hl\` RPM.** The \`aarch64\` RPM is for 64-bit images.
          Built against Sailfish OS ${SFOS_RELEASE}; installs on that release and later. Unofficial; not affiliated with NINA, ICQ or AOL.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.rpm --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.rpm --repo "$GITHUB_REPOSITORY" --title "ICQ Nina ${TAG#v}" --notes-file notes.md
          fi

  nina:
    name: Live sign-on probe against NINA
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # One probe at a time: NINA rate-limits quick repeated sign-ons.
    concurrency:
      group: nina-probe
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    env:
      NINA_UIN: ${{ secrets.NINA_UIN }}
      NINA_PASSWORD: ${{ secrets.NINA_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Check that the account secrets exist
        id: secrets
        run: |
          if [ -n "$NINA_UIN" ] && [ -n "$NINA_PASSWORD" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning title=NINA probe skipped::Add the NINA_UIN and NINA_PASSWORD repository secrets to run the live probe."; fi
      - name: Install Qt 5
        if: steps.secrets.outputs.ok == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qtbase5-dev qt5-qmake qtdeclarative5-dev libqt5sql5-sqlite
      - name: Build oscarprobe
        if: steps.secrets.outputs.ok == 'true'
        run: |
          mkdir -p build && cd build
          qmake ../harbour_icq_nina.pro && make -j"$(nproc)"
      - name: Sign on to NINA
        if: steps.secrets.outputs.ok == 'true'
        run: |
          set -o pipefail
          rc=0
          ci/nina-probe.sh build/tools/oscarprobe/oscarprobe 2>&1 | tee nina.log || rc=$?
          grep -E 'CONFIG|LOGIN|OWN-INFO|CONTACT-LIST|INFO-|SEARCH-|DNS |PROXY-HOST|FT-|RESULT|TASK-ERROR|SOCKET-ERROR|nina probe|== |TRACE .*(ffline|04/10|proxy|got port|listening|socket error|other user|own proposal|Received (basic|more|short))' nina.log > nina-summary.log || true
          ci/annotate.sh "$([ $rc = 0 ] && echo notice || echo error)" "NINA summary" nina-summary.log 240
          ci/annotate.sh "$([ $rc = 0 ] && echo notice || echo error)" "NINA probe" nina.log 120
          exit $rc
